# Topo server settings (KEY=VALUE, one per line; SERVER.md lists every key).
# After a change:
#   sudo launchctl kickstart -k system/systems.carino.topo-server
#
# As shipped every line is a comment: the server answers only on this Mac at
# http://127.0.0.1:7380 and writes sign-in codes to
# /Library/Logs/Topo/topo-server.log. Data: /Library/Application Support/Topo/data.

# The address people open. Behind a reverse proxy with https on this Mac:
#TOPO_PUBLIC_URL=https://topo.example.com
#TOPO_TRUSTED_PROXIES=127.0.0.1/32
# Or https built in, with your own certificate (readable by _topo) ...
#TOPO_LISTEN=0.0.0.0:7380
#TOPO_TLS_CERT=/Library/Application Support/Topo/tls/cert.pem
#TOPO_TLS_KEY=/Library/Application Support/Topo/tls/key.pem
# ... or a self-signed one the server makes in the data folder:
#TOPO_TLS_SELF=1

# The server owner and email (sign-in codes are sent by email).
#TOPO_OWNER_EMAIL=it@example.com
#TOPO_SMTP_HOST=smtp.office365.com
#TOPO_SMTP_PORT=587
#TOPO_SMTP_USER=topo@example.com
#TOPO_SMTP_PASS_FILE=/Library/Application Support/Topo/smtp.pass
#TOPO_SMTP_FROM=Topo <topo@example.com>

# Folders a "folder on the server" backup may use (: between folders); each
# must exist and belong to _topo (sudo chown _topo:_topo /Volumes/Backup/Topo).
#TOPO_BACKUP_FOLDERS=/Library/Application Support/Topo/data/backups:/Volumes/Backup/Topo
