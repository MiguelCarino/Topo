[package]
name = "topo"
version = "0.0.0"
description = "Topo, the network documentation editor, as a desktop app"
authors = ["Miguel Carino"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/MiguelCarino/Topo"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"

[profile.release]
strip = true
