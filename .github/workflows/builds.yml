# Offline builds: the zip and the desktop apps, into one DRAFT release.
#
# Run it from Actions > Builds > Run workflow (or push a v* tag). It never
# publishes: the owner reads the draft, then publishes it, which makes the tag.
# Builds are unsigned (no signing secrets exist); see desktop/release-notes.md.
#
# Versions are year.month.patch (docs/SCOPE.md D463): v26.11.0 is the first
# release of November 2026, v26.11.1 the next one that month, a hotfix or
# not. Two-digit year, no leading zeros, because an MSI allows 255.255.65535.
# A tag v26.11.0 builds 26.11.0, and so does a dispatch given that tag (into
# its draft, without pushing the tag). A dispatch with no tag builds the next
# release of this month: one more than the highest published v<YY>.<M>.x, or
# .0; run again, it reuses the same draft until that version is published.
#
# Platforms: a dispatch can build only the x64 or only the Arm apps; the rest
# can be built elsewhere (an Arm Mac) and uploaded to the same draft with
# `gh release upload v1.2.3 <files>`. A tag push builds them all.
#
# One release per tag: a re-run (all jobs or failed ones) reuses its own
# draft and replaces the zip in it. A tag that already has a published
# release builds nothing, so publishing a draft (which pushes its tag) does
# not start a second build.
name: Builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build into its draft (v26.11.0); empty builds the next release of this month'
        required: false
        default: ''
      platforms:
        description: 'Desktop apps to build'
        type: choice
        options: [all, x64, arm64]
        default: all
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Zip and draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.existing.outputs.skip }}
      matrix: ${{ steps.platforms.outputs.matrix }}
      monitor_matrix: ${{ steps.platforms.outputs.monitor_matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            v="${REF_NAME#v}"
          elif [ -n "$INPUT_TAG" ]; then
            v="${INPUT_TAG#v}"
          else
            # The next release of this month: published releases only, so a
            # draft never counts and re-running fills the same draft.
            yy="$(date -u +%y)"; mm="$(date -u +%-m)"
            last="$(gh api "repos/$REPO/releases" --paginate \
              -q '.[] | select(.draft | not) | .tag_name' \
              | awk -F. -v y="v$yy" -v m="$mm" '$1 == y && $2 == m && $3 ~ /^[0-9]+$/ && NF == 3 { print $3 }' \
              | sort -n | tail -1)"
            v="$yy.$mm.$(( ${last:--1} + 1 ))"
            echo "No tag: the next release of this month is $v."
          fi
          # Year (2 digits), month (1-12), patch; no leading zeros.
          if ! printf '%s' "$v" | grep -Eq '^[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]{0,4})$'; then
            echo "::error::version '$v' is not year.month.patch (26.11.0)"; exit 1
          fi
          IFS=. read -r year month patch <<< "$v"
          if [ "$patch" -gt 65535 ]; then
            echo "::error::version '$v' does not fit an MSI (patch up to 65535)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      # The desktop apps to build: all of them, or a dispatch's x64 or Arm half.
      - name: Platforms
        id: platforms
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          # 22.04 for the lowest glibc the Linux builds then need; native Arm
          # Linux because an AppImage cannot be cross-built.
          all='[
            {"name":"macos-arm64","arch":"arm64","os":"macos-latest","target":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin"},
            {"name":"macos-x64","arch":"x64","os":"macos-latest","target":"x86_64-apple-darwin","args":"--target x86_64-apple-darwin"},
            {"name":"linux-x64","arch":"x64","os":"ubuntu-22.04","target":"","args":""},
            {"name":"linux-arm64","arch":"arm64","os":"ubuntu-22.04-arm","target":"","args":""},
            {"name":"windows-x64","arch":"x64","os":"windows-latest","target":"","args":""},
            {"name":"windows-arm64","arch":"arm64","os":"windows-latest","target":"aarch64-pc-windows-msvc","args":"--target aarch64-pc-windows-msvc"}
          ]'
          case "$PLATFORMS" in all|x64|arm64) ;; *) echo "::error::platforms '$PLATFORMS' is not all, x64 or arm64"; exit 1 ;; esac
          m=$(jq -c --arg p "$PLATFORMS" '[.[] | select($p == "all" or .arch == $p)]' <<< "$all")
          echo "Building: $(jq -r '[.[].name] | join(", ")' <<< "$m")"
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          # topo-monitor (the job below): Linux on its own architecture, and
          # Windows, whose Arm exe is cross-built on the x64 runner as the
          # app's is (so it is built and packed, never run).
          mon='[
            {"name":"linux-x64","arch":"x64","pkg":"amd64","os":"ubuntu-22.04","target":"","args":"","run":true},
            {"name":"linux-arm64","arch":"arm64","pkg":"arm64","os":"ubuntu-22.04-arm","target":"","args":"","run":true},
            {"name":"windows-x64","arch":"x64","pkg":"x64","os":"windows-latest","target":"","args":"","run":true},
            {"name":"windows-arm64","arch":"arm64","pkg":"arm64","os":"windows-latest","target":"aarch64-pc-windows-msvc","args":"--target aarch64-pc-windows-msvc","run":false}
          ]'
          mm=$(jq -c --arg p "$PLATFORMS" '[.[] | select($p == "all" or .arch == $p)]' <<< "$mon")
          echo "Monitor: $(jq -r '[.[].name] | join(", ")' <<< "$mm")"
          echo "monitor_matrix=$mm" >> "$GITHUB_OUTPUT"

      - name: Existing release for the tag
        id: existing
        uses: actions/github-script@v9
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const { TAG } = process.env;
            const all = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const mine = all.filter((r) => r.tag_name === TAG);
            const published = mine.find((r) => !r.draft);
            if (published) {
              core.notice(`${TAG} is already published (${published.html_url}); nothing to build.`);
              core.setOutput('skip', 'true');
              return;
            }
            core.setOutput('skip', 'false');
            // The oldest draft for this tag, from an earlier attempt of this run.
            const draft = mine.sort((a, b) => a.id - b.id)[0];
            core.setOutput('draft_id', draft ? String(draft.id) : '');
            if (draft) core.info(`Reusing draft ${draft.id} for ${TAG}.`);

      - name: Check the stage script
        if: steps.existing.outputs.skip != 'true'
        run: node tests/stage-check.mjs

      - name: Stage and zip
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./desktop/stage.sh "desktop/out/Topo-$V"
          cp desktop/zip-README.txt "desktop/out/Topo-$V/README.txt"
          (cd desktop/out && zip -r -9 -X "Topo-$V-offline.zip" "Topo-$V")
          ls -l desktop/out

      - name: Draft release with the zip
        id: draft
        if: steps.existing.outputs.skip != 'true'
        uses: actions/github-script@v9
        env:
          V: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DRAFT_ID: ${{ steps.existing.outputs.draft_id }}
        with:
          script: |
            const fs = require('fs');
            const { V, TAG, DRAFT_ID } = process.env;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const fields = {
              target_commitish: context.sha,
              name: 'Topo ' + TAG,
              body: fs.readFileSync('desktop/release-notes.md', 'utf8'),
              draft: true,
            };
            const { data } = DRAFT_ID
              ? await github.rest.repos.updateRelease({ ...repo, release_id: Number(DRAFT_ID), tag_name: TAG, ...fields })
              : await github.rest.repos.createRelease({ ...repo, tag_name: TAG, ...fields });
            const name = `Topo-${V}-offline.zip`;
            // A re-run replaces the zip it uploaded before.
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id: data.id, per_page: 100 });
            for (const a of assets.filter((x) => x.name === name)) {
              await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: a.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              ...repo,
              release_id: data.id,
              name,
              data: fs.readFileSync(`desktop/out/${name}`),
              headers: { 'content-type': 'application/zip' },
            });
            core.setOutput('id', String(data.id));

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: release
    if: needs.release.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      # Windows runners check out with core.autocrlf=true. .gitattributes
      # already says LF; this keeps it so for anything it does not cover, so
      # stage.sh runs in Git Bash and the app gets the website's bytes.
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # ring (the app's TLS and the monitor's encryption, docs/SCOPE.md D193)
      # builds its Arm assembly on Windows with clang: the runner's LLVM is put
      # first on the PATH, and the build says which clang it found.
      - name: clang for ring on Windows Arm
        if: matrix.name == 'windows-arm64'
        shell: pwsh
        run: |
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "C:\Program Files\LLVM\bin\clang.exe" --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'
          key: ${{ matrix.name }}

      - name: Stage, icons, version
        shell: bash
        env:
          V: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          npm install -g @tauri-apps/cli@2.12.4
          ./desktop/stage.sh desktop/dist --desktop
          (cd desktop && tauri icon ../logo.svg -o src-tauri/icons)
          # The Mac's Dock icon: the same mark on the map's blueprint blue
          # (desktop/icon-macos.svg); Windows and Linux keep the bare mark.
          (cd desktop && tauri icon icon-macos.svg -o "$RUNNER_TEMP/mac-icons" && cp "$RUNNER_TEMP/mac-icons/icon.icns" src-tauri/icons/icon.icns)
          node desktop/set-version.mjs "$V"

      # "This PC as the server" (D113): tauri.conf.json bundles topo-server
      # (bundle.externalBin), and tauri-build refuses to compile until the
      # file for the target exists, so it is built first, for the same target.
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Built-in server
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: ./desktop/sidecar.sh "$TARGET"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: tauri
          releaseId: ${{ needs.release.outputs.release_id }}
          # v1 sets the release's draft flag to this on every upload, and its
          # default (false) published v0.0.1: the owner publishes, never a build.
          releaseDraft: true
          args: ${{ matrix.args }}
          retryAttempts: 1

      # "Use this PC as the server" (D125): the one package carries the unit,
      # the sysusers file and the polkit action, and enables nothing.
      - name: Check the Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y rpm cpio libxml2-utils
          b=desktop/src-tauri/target/release/bundle
          tests/desktop-packages.sh "$(ls $b/rpm/*.rpm | head -1)" "$(ls $b/deb/*.deb | head -1)"

      # The NSIS installer cannot be built on the Linux machine the rest is
      # made on, so its server tick box is checked here: a silent install
      # with /SERVER on this throwaway runner, a reinstall, an uninstall.
      - name: Check the Windows installer's server service
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          pwsh -File tests/desktop-installer-windows.ps1 -Setup $setup.FullName

  # topo-monitor (desktop/monitor, docs/SCOPE.md D461, D462): the site
  # monitor with no screen, into the same draft. For Linux a tar.gz, an rpm
  # and a deb; for Windows a zip. It has no window system, so it needs none
  # of the desktop job's packages. A Linux binary is built on its own
  # architecture (it is packed where it was built) and on 22.04, for the
  # lowest glibc. A dispatch's x64 or Arm half builds only that half.
  monitor:
    name: Monitor ${{ matrix.name }}
    needs: release
    if: needs.release.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.monitor_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7

      # ring builds its Arm assembly on Windows with clang, as for the app.
      - name: clang for ring on Windows Arm
        if: matrix.name == 'windows-arm64'
        shell: pwsh
        run: |
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "C:\Program Files\LLVM\bin\clang.exe" --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/monitor -> target'
          key: monitor-${{ matrix.name }}

      # ---- Linux: the tar.gz, the rpm and the deb ----
      - name: Packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rpm cpio binutils

      # The crates are fetched here (the Makefile's own flags build offline).
      - name: Tests
        if: runner.os == 'Linux'
        working-directory: desktop/monitor
        run: make test CARGOFLAGS=-j4

      - name: Packages, built and checked
        if: runner.os == 'Linux'
        working-directory: desktop/monitor
        env:
          V: ${{ needs.release.outputs.version }}
          ARCH: ${{ matrix.pkg }}
        run: make packages-test VERSION="$V" ARCH="$ARCH" CARGOFLAGS=-j4

      # ---- Windows: the zip ----
      # The program's own tests (its commands, its files, the checks it is
      # sent). The app's shared files are tested where the app is; several of
      # theirs open sockets a Windows runner answers differently.
      - name: Tests (Windows)
        if: runner.os == 'Windows' && matrix.run
        working-directory: desktop/monitor
        shell: bash
        run: |
          cargo test -j4 -- --skip checks:: --skip client:: --skip issues:: --skip monitor:: --skip monitorlink:: --skip servercrypto:: --skip stats::

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop/monitor
        shell: bash
        env:
          TOPO_MONITOR_VERSION: ${{ needs.release.outputs.version }}
          ARGS: ${{ matrix.args }}
        run: cargo build --release -j4 $ARGS

      - name: Zip, packed and checked (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop/monitor
        shell: pwsh
        env:
          V: ${{ needs.release.outputs.version }}
          ARCH: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
        run: |
          $exe = if ($env:TARGET) { "target/$($env:TARGET)/release/topo-monitor.exe" } else { "target/release/topo-monitor.exe" }
          ./packaging/build-windows.ps1 -Version $env:V -Arch $env:ARCH -Exe $exe

      # Into the draft the first job made; a re-run replaces what it uploaded.
      - name: Upload to the draft release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          WANT: ${{ runner.os == 'Windows' && '1' || '3' }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const release_id = Number(process.env.RELEASE_ID);
            const want = Number(process.env.WANT);
            const dir = 'desktop/monitor/dist';
            const files = fs.readdirSync(dir).filter((f) => /^topo-monitor[-_].*\.(tar\.gz|rpm|deb|zip)$/.test(f));
            if (files.length !== want) { core.setFailed(`expected ${want} package(s) in ${dir}, found: ${files.join(', ') || 'none'}`); return; }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id, per_page: 100 });
            for (const name of files) {
              for (const a of assets.filter((x) => x.name === name)) {
                await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: a.id });
              }
              await github.rest.repos.uploadReleaseAsset({
                ...repo,
                release_id,
                name,
                data: fs.readFileSync(path.join(dir, name)),
                headers: { 'content-type': 'application/octet-stream' },
              });
              core.info(`uploaded ${name}`);
            }
